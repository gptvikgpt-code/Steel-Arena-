name: Steel Arena cross-runner WebRTC experiment
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: steel-arena-cross-runner
  cancel-in-progress: true
jobs:
  separate-machines:
    name: ${{ matrix.mode }} / ${{ matrix.role }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Both host and guest must be eligible to start concurrently for each mode.
      # A limit of two can schedule two hosts first, leaving no guest to connect.
      max-parallel: 4
      matrix:
        include:
          - { role: host, mode: duel, os: ubuntu-24.04, browser: chromium }
          - { role: guest, mode: duel, os: macos-latest, browser: webkit }
          - { role: host, mode: platform, os: ubuntu-24.04, browser: chromium }
          - { role: guest, mode: platform, os: macos-latest, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the published game assets to match this commit
        shell: bash
        run: |
          set -euo pipefail
          base='https://gptvikgpt-code.github.io/Steel-Arena-'
          for attempt in $(seq 1 15); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "$base/" -o /tmp/steel-arena-cross-public.html \
              && curl -fsSL --connect-timeout 10 --max-time 25 "$base/game.js" -o /tmp/steel-arena-cross-public.js \
              && cmp -s game.js /tmp/steel-arena-cross-public.js; then
              grep -q 'id="create-room"' /tmp/steel-arena-cross-public.html
              grep -q 'id="join-code"' /tmp/steel-arena-cross-public.html
              grep -q 'id="move-joystick"' /tmp/steel-arena-cross-public.html
              echo "Public game.js matches the checked-out revision (attempt $attempt)."
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::Public GitHub Pages assets did not match this revision."
              exit 1
            fi
            sleep 15
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check tests/cross-runner.mjs
      - run: npx playwright install --with-deps chromium
        if: matrix.browser == 'chromium'
      - run: npx playwright install webkit
        if: matrix.browser == 'webkit'
      - name: Exercise real WebRTC across separate cloud machines
        env:
          ARENA_TEST_ROLE: ${{ matrix.role }}
          ARENA_TEST_MODE: ${{ matrix.mode }}
        run: node tests/cross-runner.mjs
      - name: Scope
        if: success()
        run: echo 'Cross-runner pass is not a physical Android/iPhone cross-carrier certification.'
