name: Steel Arena published-site smoke
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
concurrency:
  group: steel-arena-public-smoke
  cancel-in-progress: true
jobs:
  published-online-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the published game assets to match this commit
        shell: bash
        run: |
          set -euo pipefail
          base='https://gptvikgpt-code.github.io/Steel-Arena-'
          for attempt in $(seq 1 15); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "$base/" -o /tmp/steel-arena-public.html \
              && curl -fsSL --connect-timeout 10 --max-time 25 "$base/game.js" -o /tmp/steel-arena-public.js \
              && cmp -s game.js /tmp/steel-arena-public.js; then
              echo "Public game.js matches the checked-out revision (attempt $attempt)."
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::Public GitHub Pages assets did not match this revision."
              exit 1
            fi
            sleep 15
          done
          grep -q 'id="create-room"' /tmp/steel-arena-public.html
          grep -q 'id="join-code"' /tmp/steel-arena-public.html
          grep -q 'id="move-joystick"' /tmp/steel-arena-public.html
          ! grep -q 'Replit Agent is building' /tmp/steel-arena-public.html
      - run: npm install --no-audit --no-fund
      - run: npm run check:syntax
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify online rooms and both modes against the PUBLISHED URL
        env:
          ARENA_TEST_URL: https://gptvikgpt-code.github.io/Steel-Arena-/
        run: npm run test:online
      - name: Explain the scope of the result
        if: success()
        run: echo 'PASS means published-site browser simulation on one GitHub runner, NOT Android/iPhone cross-carrier device certification.'
