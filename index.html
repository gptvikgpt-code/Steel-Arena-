<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Arena</title>
<style>body{margin:0;background:#10131e;color:white;font:16px system-ui;text-align:center}header{padding:14px}canvas{background:#1d2332;width:min(96vw,900px);touch-action:none;border:2px solid #5e718b}button{padding:13px;margin:5px;border:0;border-radius:8px;background:#e45d49;color:white;font-weight:bold}</style>
<header><h2>⚔️ STEEL ARENA</h2><p id="status">Локальный прототип — онлайн-режим ещё не подключён</p></header>
<canvas id="arena" width="900" height="480"></canvas><div><button id="left">◀</button><button id="attack">УДАР</button><button id="right">▶</button></div>
<script>
const c=document.getElementById('arena'),g=c.getContext('2d');let keys={};let p={x:160,hp:100},bot={x:690,hp:100},cool=0,bcool=0;
for(const [id,key] of [['left','a'],['right','d'],['attack',' ']]){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)};el.onpointerup=el.onpointercancel=()=>keys[key]=false}
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;
function frame(){g.clearRect(0,0,900,480);g.fillStyle='#343f53';g.fillRect(0,400,900,80);if(p.hp>0&&bot.hp>0){if(keys.a)p.x-=4;if(keys.d)p.x+=4;p.x=Math.max(25,Math.min(845,p.x));bot.x+=Math.sign(p.x-bot.x)*1.3;if(cool)cool--;if(bcool)bcool--;if(keys[' ']&&!cool){cool=28;if(Math.abs(p.x-bot.x)<110)bot.hp=Math.max(0,bot.hp-12)}if(Math.abs(p.x-bot.x)<65&&!bcool){bcool=65;p.hp=Math.max(0,p.hp-8)}}for(const [f,color] of [[p,'#4bb5ff'],[bot,'#fa665a']]){g.fillStyle=color;g.fillRect(f.x,310,55,90);g.fillStyle='#fff';g.fillRect(f.x+12,322,12,12)}g.fillStyle='#fff';g.font='22px system-ui';g.fillText('Игрок: '+p.hp,25,40);g.fillText('Бот: '+bot.hp,740,40);if(!p.hp||!bot.hp){g.font='45px system-ui';g.fillText(p.hp?'ПОБЕДА!':'ПОРАЖЕНИЕ',310,230)}requestAnimationFrame(frame)}frame();
</script></html>
