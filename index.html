<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Arena PvP</title>
<style>body{background:#101521;color:#fff;text-align:center;font:16px system-ui;margin:0;padding:12px}canvas{width:min(96vw,900px);background:#202a3c;border:2px solid #677c9a;touch-action:none}button,input,textarea{font:inherit;padding:10px;border-radius:8px;margin:4px}button{background:#d45b48;color:#fff;border:0}textarea{width:min(90vw,650px);height:70px}#setup{max-width:740px;margin:auto}small{color:#b7c8e1}</style>
<h2>⚔️ STEEL ARENA</h2><div id="setup"><p id="status">Выбери роль. Соединение WebRTC без Replit.</p><button onclick="host()">Создать комнату</button><button onclick="join()">Присоединиться</button><p><small>Для соединения обменяйтесь кодами через мессенджер: сначала приглашение, затем ответ.</small></p><textarea id="incoming" placeholder="Вставь сюда код другого игрока"></textarea><br><button onclick="apply()">Применить код</button><textarea id="outgoing" readonly placeholder="Здесь появится код для отправки другу"></textarea><br><button onclick="copy()">Копировать код</button></div>
<canvas id="arena" width="900" height="480"></canvas><div><button id="left">◀</button><button id="attack">УДАР</button><button id="right">▶</button></div>
<script>
let pc,channel,role='',keys={},me={x:120,hp:100},other={x:720,hp:100},cool=0,lastAttack=0,connected=false;const $=id=>document.getElementById(id);const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function status(s){$('status').textContent=s}function init(){pc=new RTCPeerConnection(cfg);pc.onconnectionstatechange=()=>status('Соединение: '+pc.connectionState);pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='failed')status('Не удалось соединиться: возможно, нужен TURN-сервер')};pc.ondatachannel=e=>wire(e.channel);pc.onicecandidate=()=>{}}
function wire(c){channel=c;c.onopen=()=>{connected=true;status('🟢 Два игрока подключены!');$('setup').style.display='none'};c.onclose=()=>{connected=false;status('Связь прервана');$('setup').style.display='block'};c.onmessage=e=>{try{let m=JSON.parse(e.data);if(m.t==='state'){other.x=m.x;other.hp=m.hp;if(role==='guest')me.hp=m.yhp}else if(m.t==='attack'&&role==='host'){if(Date.now()-lastAttack>350){lastAttack=Date.now();if(Math.abs(me.x-other.x)<105)me.hp=Math.max(0,me.hp-10)}}}catch{}}}
async function offer(){let d=await pc.createOffer();await pc.setLocalDescription(d);await gather();$('outgoing').value=JSON.stringify(pc.localDescription);status('Отправь код другу, затем вставь его ответ')}
async function gather(){if(pc.iceGatheringState==='complete')return;await new Promise(resolve=>{let t=setTimeout(resolve,7000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);resolve()}},{once:false})})}
async function host(){role='host';init();wire(pc.createDataChannel('arena'));await offer()}
function join(){role='guest';init();status('Вставь приглашение создателя комнаты и нажми «Применить код»')}
async function apply(){try{let d=JSON.parse($('incoming').value.trim());if(!pc)throw Error('Сначала выбери роль');await pc.setRemoteDescription(d);if(role==='guest'&&d.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());await gather();$('outgoing').value=JSON.stringify(pc.localDescription);status('Отправь код ответа создателю комнаты')}else status('Ожидаем соединение...')}catch(e){status('Ошибка кода: '+e.message)}}
async function copy(){try{await navigator.clipboard.writeText($('outgoing').value);status('Код скопирован')}catch{status('Выдели код и скопируй вручную')}}
for(let [id,key] of [['left','a'],['right','d'],['attack',' ']]){let e=$(id);e.onpointerdown=v=>{v.preventDefault();keys[key]=true;e.setPointerCapture(v.pointerId)};e.onpointerup=e.onpointercancel=()=>keys[key]=false}
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;
const g=$('arena').getContext('2d');let lastSend=0;function frame(t){if(connected&&me.hp>0&&other.hp>0){if(keys.a)me.x-=4;if(keys.d)me.x+=4;me.x=Math.max(10,Math.min(835,me.x));if(cool)cool--;if(keys[' ']&&!cool){cool=25;if(role==='host'){if(Math.abs(me.x-other.x)<105)other.hp=Math.max(0,other.hp-10)}else channel.send(JSON.stringify({t:'attack'}))}if(t-lastSend>45){lastSend=t;channel.send(JSON.stringify({t:'state',x:me.x,hp:me.hp,yhp:other.hp}))}}g.clearRect(0,0,900,480);g.fillStyle='#3b4c62';g.fillRect(0,405,900,75);for(let [p,color] of [[me,'#48b7ff'],[other,'#ff6758']]){g.fillStyle=color;g.fillRect(p.x,315,55,90);g.fillStyle='white';g.fillRect(p.x+12,327,12,12)}g.fillStyle='white';g.font='23px system-ui';g.fillText('Ты: '+me.hp,20,35);g.fillText('Соперник: '+other.hp,690,35);if(!me.hp||!other.hp){g.font='48px system-ui';g.fillText(me.hp?'ПОБЕДА':'ПОРАЖЕНИЕ',320,225)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
