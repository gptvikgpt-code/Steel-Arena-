<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Arena 3D</title><style>body{margin:0;background:#080b16;color:#fff;font:16px system-ui;text-align:center;overflow:hidden}header{position:absolute;z-index:2;top:8px;width:100%;pointer-events:none;text-shadow:0 2px 5px #000}h2{margin:3px}#status{font-size:13px;color:#e4d4aa}.controls{position:absolute;bottom:16px;width:100%;display:flex;justify-content:space-around;z-index:2}button{background:#ad4337cc;color:white;border:1px solid #e6b79d;border-radius:14px;padding:17px 23px;font-weight:700;font-size:17px;touch-action:none}canvas{display:block}#health{display:flex;justify-content:space-between;margin:8px 20px;font-size:14px}</style></head><body><header><h2>⚔️ STEEL ARENA 3D</h2><div id="status">3D-прототип • бой против бота • онлайн-комнаты пока недоступны</div><div id="modes" style="pointer-events:auto"><button onclick="window.setMode('duel')">⚔️ Дуэль</button><button onclick="window.setMode('platform')">🪽 Платформы</button></div><div id="health"><span id="h1">Игрок 100</span><span id="h2">Противник 100</span></div></header><div class="controls"><div><button id="left">◀</button><button id="right">▶</button></div><div><button id="jump">ПРЫЖОК</button><button id="block">ЩИТ</button><button id="attack">УДАР ⚔️</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111728);scene.fog=new THREE.Fog(0x111728,18,48);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,100);camera.position.set(0,5.4,15);camera.lookAt(0,2,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9fbaff,0x34231e,2));let sun=new THREE.DirectionalLight(0xffd8a2,3);sun.position.set(-5,12,8);sun.castShadow=true;scene.add(sun);
const mat=(color,metalness=0)=>new THREE.MeshStandardMaterial({color,metalness,roughness:metalness?.32:.8});
const stone=mat(0x414b60),gold=mat(0xd8b77a,.7),floor=mat(0x555463);
function box(w,h,d,m,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
box(25,.7,11,floor,0,-.45,0);for(let i=-12;i<=12;i+=2){box(.06,.015,11,stone,i,-.08,0)}for(let x of [-11,11])for(let z of [-4,4]){box(.9,4,.9,stone,x,1.8,z);box(1.25,.3,1.25,gold,x,3.9,z)}
for(let i=0;i<16;i++){let a=i*Math.PI/8;box(1,2,1,mat(0x262e40),Math.cos(a)*17,.3,Math.sin(a)*13)}
function warrior(color,x,flip){let root=new THREE.Group();root.position.x=x;root.rotation.y=flip?Math.PI:0;scene.add(root);const armor=mat(color,.8),dark=mat(0x252c3c,.65),steel=mat(0xdde5ec,.9);
box(.8,1.25,.55,armor,0,2.05,0,root);box(.7,.65,.65,steel,0,3.1,0,root);box(.8,.18,.8,gold,0,3.5,0,root);
for(let side of [-1,1]){box(.3,.9,.32,dark,side*.25,.95,0,root);box(.43,.38,.65,armor,side*.62,2.65,0,root)}
let arm=new THREE.Group();arm.position.set(.7,2.52,0);root.add(arm);box(.25,1.05,.28,armor,0,-.5,0,arm);box(.16,1.65,.12,steel,.05,-1.72,0,arm);box(.48,.12,.22,gold,.05,-1.05,0,arm);
let shield=box(.22,1.2,.85,steel,-.95,1.9,.15,root);return {root,arm,shield,hp:100,x,attack:0,blocking:false}}
let player=warrior(0x3479c9,-4,false),enemy=warrior(0xc34a39,4,true),keys={},cool=0,botcool=0,mode='duel',vy=0,ground=0,botVy=0,botGround=0;
const platforms=[];for(let x of [-5,0,5]){let p=box(3,.35,2,mat(0x7b7292),x,1.2,-.3);platforms.push(p);p.visible=false}
window.setMode=m=>{mode=m;player.hp=100;enemy.hp=100;player.x=-4;enemy.x=4;ground=botGround=vy=botVy=0;platforms.forEach(p=>p.visible=m==='platform');document.getElementById('status').textContent=m==='duel'?'⚔️ Классическая дуэль против бота':'🪽 Платформенный режим против бота'};

for(let id of ['left','right','attack','block','jump']){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[id]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[id]=false}
onkeydown=e=>{let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;if(k===' ')keys.attack=true;if(k==='s')keys.block=true;if(k==='w'||k==='arrowup')keys.jump=true};onkeyup=e=>{let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false;if(k===' ')keys.attack=false;if(k==='s')keys.block=false;if(k==='w'||k==='arrowup')keys.jump=false};
function animate(t){requestAnimationFrame(animate);let dt=Math.min(.04,(t-(animate.prev||t))/1000);animate.prev=t;if(player.hp>0&&enemy.hp>0){player.blocking=!!keys.block;if(keys.left)player.x-=dt*4;if(keys.right)player.x+=dt*4;player.x=Math.max(-9,Math.min(9,player.x));enemy.x+=Math.sign(player.x-enemy.x)*dt*1.5;enemy.x=Math.max(-9,Math.min(9,enemy.x));if(mode==='platform'){if(keys.jump&&ground<=.01)vy=7.5;vy-=17*dt;let previous=ground;ground=Math.max(0,ground+vy*dt);if(ground===0)vy=0;for(let p of platforms){let top=p.position.y+.175;if(vy<=0&&previous>=top-.15&&ground<=top&&Math.abs(player.x-p.position.x)<1.55){ground=top;vy=0}}if(botGround===0&&Math.random()<dt*.6)botVy=7;botVy-=17*dt;botGround=Math.max(0,botGround+botVy*dt);if(botGround===0)botVy=0}else{ground=botGround=0;vy=botVy=0}cool-=dt;botcool-=dt;if(keys.attack&&cool<=0){cool=.65;player.attack=.35;if(Math.abs(player.x-enemy.x)<2.4&&Math.abs(ground-botGround)<1.7)enemy.hp=Math.max(0,enemy.hp-13)}if(Math.abs(player.x-enemy.x)<2.1&&Math.abs(ground-botGround)<1.7&&botcool<=0){botcool=1.1;enemy.attack=.35;player.hp=Math.max(0,player.hp-(player.blocking?2:10))}}for(let w of [player,enemy]){w.root.position.x=w.x;w.root.position.y=w===player?ground:botGround;w.attack=Math.max(0,w.attack-dt);w.arm.rotation.z=w.attack?Math.sin((.35-w.attack)/.35*Math.PI)*-1.8:0;w.shield.position.y=w===player&&w.blocking?2.25:1.9;w.root.position.y+=(Math.sin(t*.003)*.04)}document.getElementById('h1').textContent='Игрок '+player.hp;document.getElementById('h2').textContent='Противник '+enemy.hp;if(!player.hp||!enemy.hp)document.getElementById('status').textContent=player.hp?'🏆 Победа! Перезагрузи страницу для нового боя':'💀 Поражение! Перезагрузи страницу';renderer.render(scene,camera)}requestAnimationFrame(animate);
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
